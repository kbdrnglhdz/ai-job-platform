services:
  mysql:
    image: mysql:8.4
    container_name: pcia-mysql
    environment:
      MYSQL_DATABASE: pcia_db
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - pcia_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  pcia_mysql_data:
